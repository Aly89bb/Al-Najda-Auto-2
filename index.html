<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --charcoal:#14171C;--charcoal-2:#1B1F28;--charcoal-3:#232833;
  --navy:#0E2340;--navy-2:#132C4E;
  --orange:#FF6A00;--orange-d:#E85D00;--yellow:#FFC22E;--red:#E23744;--green:#22C55E;
  --text:#EEF1F5;--muted:#93A0B2;
  --line:rgba(255,255,255,0.08);--glass:rgba(18,23,32,0.72);
  --radius:16px;--radius-sm:10px;--shadow:0 12px 34px rgba(0,0,0,0.45);
  --ease:cubic-bezier(0.25,1,0.5,1);--spring:cubic-bezier(0.34,1.56,0.64,1);
}
html,body{height:100%;overflow:hidden}
body{background:var(--charcoal);color:var(--text);font-family:'Cairo','Inter',sans-serif;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#root{flex:1;display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;border:none;outline:none;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--orange);border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.fade-in{animation:fadeIn .4s var(--ease)}
.app{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:18px}
.loader{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
/* Top bar (glass) */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--line);flex-shrink:0;z-index:50}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand img{width:34px;height:34px;border-radius:9px}
.topbar-brand .tt{font-size:14px;font-weight:800;line-height:1}
.topbar-brand .ts{font-size:9px;color:var(--yellow);font-weight:700;letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
/* Lang switch */
.lang{display:flex;gap:2px;background:var(--charcoal-3);border-radius:9px;padding:2px;border:1px solid var(--line)}
.lang button{background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:5px 8px;border-radius:7px;min-width:28px;line-height:1;transition:all .15s}
.lang button.on{background:var(--orange);color:#fff}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:var(--radius-sm);
  font-size:15px;font-weight:800;width:100%;transition:transform .14s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(255,106,0,.32)}
.btn-yellow{background:var(--yellow);color:#3a2600}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-ghost{background:var(--charcoal-3);color:var(--text)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:9px;width:auto}
/* Cards / inputs */
.card{background:var(--charcoal-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.field{margin-bottom:14px}
.label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;padding:13px 14px;transition:border-color .2s}
.input:focus{border-color:var(--orange)}
.section-title{font-size:15px;font-weight:800;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
.badge-orange{background:rgba(255,106,0,.14);color:var(--orange)}
.badge-green{background:rgba(34,197,94,.14);color:var(--green)}
.badge-muted{background:rgba(255,255,255,.06);color:var(--muted)}

/* ── Phase 2: client flow ── */
.tier{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:var(–radius);border:2px solid var(–line);background:var(–charcoal-2);cursor:pointer;margin-bottom:12px;transition:transform .14s var(–spring),border-color .2s}
.tier:active{transform:scale(.98)}
.tier.premium{border-color:rgba(255,194,46,.4);background:linear-gradient(135deg,rgba(255,194,46,.08),var(–charcoal-2))}
.tier .tic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(–navy);flex-shrink:0}
.tier.premium .tic{background:rgba(255,194,46,.15)}
.step-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(–orange);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.media-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(–line);background:var(–navy)}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.media-item .rm{position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.media-item .vtag{position:absolute;bottom:3px;inset-inline-start:3px;font-size:12px}
.up-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;border-radius:10px;border:1.5px dashed var(–line);background:rgba(255,255,255,.03);color:var(–muted);font-size:11px;font-weight:700}
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pm-card{background:#fff;border:2px solid transparent;border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .14s var(–spring)}
.pm-card:active{transform:scale(.96)}
.pm-card.sel{border-color:var(–orange);box-shadow:0 0 0 3px rgba(255,106,0,.22)}
.pm-card img{width:44px;height:44px;object-fit:contain}
.pm-card .pmc{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:30px}
.pm-card .pmn{font-size:10px;font-weight:800;color:#1a2340;text-align:center;line-height:1.1}
.stepper{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 4px 18px;position:relative}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;z-index:2}
.stp-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(–charcoal-3);color:var(–muted);border:2px solid var(–line);transition:all .3s var(–spring)}
.stp.done .stp-dot{background:linear-gradient(135deg,var(–orange),var(–orange-d));color:#fff;border-color:var(–orange);box-shadow:0 0 14px rgba(255,106,0,.5)}
.stp.on .stp-dot{background:var(–navy-2);color:var(–orange);border-color:var(–orange);animation:pulse 1.6s infinite}
.stp-lb{font-size:9.5px;font-weight:700;color:var(–muted);text-align:center;max-width:64px}
.stp.done .stp-lb,.stp.on .stp-lb{color:var(–orange)}
.stp-line{position:absolute;top:18px;height:3px;background:var(–line);z-index:1;border-radius:2px}
.stp-line.fill{background:linear-gradient(90deg,var(–orange),var(–orange-d))}
.call-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(–green);color:#fff;font-size:13px;font-weight:800;padding:10px 14px;border-radius:10px;text-decoration:none}

/* ── Phase 3: admin/mechanic ── */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(–charcoal-2);border-radius:12px;padding:4px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:800;color:var(–muted);background:transparent;transition:all .2s;position:relative}
.tab.on{background:var(–orange);color:#fff}
.tab .cnt{position:absolute;top:2px;inset-inline-end:6px;font-size:9px;background:var(–red);color:#fff;border-radius:8px;padding:0 4px;min-width:14px}
.req-card{background:var(–charcoal-2);border:1px solid var(–line);border-radius:14px;padding:14px;margin-bottom:11px;cursor:pointer;transition:transform .14s var(–spring)}
.req-card:active{transform:scale(.985)}
.req-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.req-name{font-size:15px;font-weight:800}
.req-meta{font-size:12px;color:var(–muted);display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.mediabar{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.mediabar img,.mediabar video{width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0;border:1px solid var(–line)}
.detail-media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.detail-media img,.detail-media video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(–line)}
.mech-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(–line)}
.mech-av{width:44px;height:44px;border-radius:50%;background:var(–navy);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.mech-av img{width:100%;height:100%;object-fit:cover}
.st-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px}
.st-available{background:var(–green)}.st-busy{background:var(–orange)}.st-repairing{background:var(–yellow)}
.st-break{background:#3B82F6}.st-leave{background:#A855F7}.st-off{background:#6B7280}
.status-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.status-chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;background:var(–charcoal-3);color:var(–muted);border:1px solid var(–line)}
.status-chip.on{background:var(–orange);color:#fff;border-color:var(–orange)}
.sheet{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet-inner{background:var(–charcoal);width:100%;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:fadeIn .3s var(–ease)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(–line);flex-shrink:0}

.livemap{width:100%;height:220px;border-radius:14px;overflow:hidden;border:1px solid var(–line);background:var(–navy)}
.leaflet-container{background:#0e1a2e;font-family:‘Cairo’,sans-serif}
.mk-pin{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));line-height:1}
.track-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.track-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(–green)}
.track-live .dot{width:7px;height:7px;border-radius:50%;background:var(–green);animation:pulse 1.3s infinite}

.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:var(–charcoal-2);border:1px solid var(–line);border-radius:14px;padding:14px}
.metric .mv{font-size:24px;font-weight:900;line-height:1}
.metric .ml{font-size:11px;color:var(–muted);font-weight:700;margin-top:4px}
.metric.hl{background:linear-gradient(135deg,rgba(255,106,0,.14),var(–charcoal-2));border-color:rgba(255,106,0,.32)}
.metric.hl .mv{color:var(–orange)}
.metric.gold{background:linear-gradient(135deg,rgba(255,194,46,.14),var(–charcoal-2));border-color:rgba(255,194,46,.32)}
.metric.gold .mv{color:var(–yellow)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bar-lb{font-size:12px;width:88px;color:var(–muted);flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(–charcoal-3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(–orange),var(–orange-d));border-radius:4px;transition:width .5s var(–ease)}
.bar-val{font-size:12px;font-weight:800;width:24px;text-align:end;flex-shrink:0}
.day-chart{display:flex;align-items:flex-end;gap:6px;height:104px;padding-top:10px}
.day-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.day-bar{width:100%;background:linear-gradient(180deg,var(–orange),var(–orange-d));border-radius:5px 5px 0 0;min-height:3px;transition:height .5s var(–ease)}
.day-lb{font-size:9px;color:var(–muted)}
.dev-hd{text-align:center;padding:14px;background:linear-gradient(135deg,var(–navy),var(–navy-2));border-radius:14px;margin-bottom:14px;border:1px solid rgba(255,194,46,.25)}

.install-banner{position:fixed;left:12px;right:12px;bottom:16px;z-index:600;background:linear-gradient(160deg,var(–navy),var(–charcoal-2));border:1.5px solid rgba(255,106,0,.4);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(–shadow);animation:fadeIn .3s var(–ease)}
.install-banner img{width:44px;height:44px;border-radius:11px;flex-shrink:0}
.install-banner .ib-t{font-size:13px;font-weight:800}
.install-banner .ib-s{font-size:11px;color:var(–muted);margin-top:1px;line-height:1.3}
.install-banner .ib-b{background:var(–orange);color:#fff;font-size:12px;font-weight:800;padding:9px 13px;border-radius:9px;white-space:nowrap;flex-shrink:0}
.install-banner .ib-x{background:transparent;color:var(–muted);font-size:17px;width:24px;flex-shrink:0}

@keyframes shimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
.skel{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%);background-size:840px 100%;animation:shimmer 1.25s infinite linear;border-radius:10px}
.skel-card{background:var(–charcoal-2);border:1px solid var(–line);border-radius:14px;padding:14px;margin-bottom:11px}
.skel-line{height:12px;margin-bottom:9px}

.rating-row{display:flex;gap:6px;justify-content:center;margin:10px 0}
.rstar{font-size:32px;line-height:1;background:transparent;transition:transform .12s var(–spring);filter:grayscale(1) opacity(.45)}
.rstar.on{filter:none}
.rstar:active{transform:scale(1.25)}
.rev-txt{font-size:13px;color:var(–text);background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;margin-top:6px}
.search-box{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(–line);border-radius:10px;color:var(–text);font-size:14px;padding:11px 14px;margin-bottom:12px}
.search-box:focus{border-color:var(–orange)}
.mini-stars{color:var(–yellow);font-size:12px;font-weight:800}
</style>

</head>

// ── helpers: hash, haptic, session, upload ────────────────────
function haptic(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function randSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a).map(b=>b.toString(16).padStart(2,‘0’)).join(’’);}
async function hashPass(pw,salt){
const data=new TextEncoder().encode(salt+’:’+pw);
const buf=await crypto.subtle.digest(‘SHA-256’,data);
return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,‘0’)).join(’’);
}
function saveSession(u){try{localStorage.setItem(‘brcc_session’,JSON.stringify({id:u.id,role:u.role}));}catch(e){}}
function clearSession(){try{localStorage.removeItem(‘brcc_session’);}catch(e){}}
function loadSession(){try{return JSON.parse(localStorage.getItem(‘brcc_session’)||‘null’);}catch(e){return null;}}
async function uploadAvatar(file){
const ext=(file.name.split(’.’).pop()||‘jpg’).toLowerCase().replace(/[^a-z0-9]/g,’’)||‘jpg’;
const path=‘av_’+Date.now()+’*’+Math.random().toString(36).slice(2,7)+’.’+ext;
const up=await sb.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true,contentType:file.type||‘image/jpeg’});
if(up.error)throw up.error;

const MEDIA_BUCKET=‘media’;
async function uploadMedia(file){
const ext=(file.name.split(’.’).pop()||‘bin’).toLowerCase().replace(/[^a-z0-9]/g,’’)||‘bin’;
const path=’m*’+Date.now()+’_’+Math.random().toString(36).slice(2,7)+’.’+ext;
const up=await sb.storage.from(MEDIA_BUCKET).upload(path,file,{upsert:true,contentType:file.type||‘application/octet-stream’});
if(up.error)throw up.error;
return sb.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}
function videoDuration(file){return new Promise(res=>{try{const v=document.createElement(‘video’);v.preload=‘metadata’;v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(v.src);res(d);};v.onerror=()=>res(999);v.src=URL.createObjectURL(file);}catch(e){res(999);}});}

// ── App ───────────────────────────────────────────────────────
function App(){
const [lang,setLang]=useState(LANG);
const changeLang=l=>{applyLang(l);setLang(l);};
const [toast,showToast]=useToast();
const [stage,setStage]=useState(‘splash’);
const [role,setRole]=useState(null);
const [user,setUser]=useState(null);
const [installMode,setInstallMode]=useState(null);
useEffect(()=>{
const s=loadSession();
if(s&&s.id&&sb){sb.from(‘app_users’).select(’*’).eq(‘id’,s.id).maybeSingle().then(({data})=>{if(data){setUser(data);setStage(‘app’);}else{clearSession();setStage(‘landing’);}});}
else{const t=setTimeout(()=>setStage(‘landing’),1100);return()=>clearTimeout(t);}
},[]);
useEffect(()=>{
let dismissed=false;try{dismissed=localStorage.getItem(‘brcc_install_dismiss’)===‘1’;}catch(e){}
const standalone=(window.matchMedia&&window.matchMedia(’(display-mode: standalone)’).matches)||window.navigator.standalone===true;
if(standalone||dismissed)return;
if(deferredPrompt)setInstallMode(‘prompt’);
const onI=()=>setInstallMode(‘prompt’);window.addEventListener(‘brcc-installable’,onI);
const onInst=()=>{deferredPrompt=null;setInstallMode(null);};window.addEventListener(‘appinstalled’,onInst);
const ua=navigator.userAgent||’’;const isIOS=/iphone|ipad|ipod/i.test(ua);const isSafari=/safari/i.test(ua)&&!/crios|fxios|edgios/i.test(ua);
let tmr=null;if(isIOS&&isSafari&&!deferredPrompt)tmr=setTimeout(()=>setInstallMode(m=>m||‘ios’),2600);
return()=>{window.removeEventListener(‘brcc-installable’,onI);window.removeEventListener(‘appinstalled’,onInst);if(tmr)clearTimeout(tmr);};
},[]);
const doInstall=async()=>{if(!deferredPrompt){setInstallMode(null);return;}deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;setInstallMode(null);};
const dismissInstall=()=>{setInstallMode(null);try{localStorage.setItem(‘brcc_install_dismiss’,‘1’);}catch(e){}};
const onAuth=u=>{setUser(u);setStage(‘app’);};
const onLogout=()=>{clearSession();setUser(null);setRole(null);setStage(‘landing’);};
const onUpdate=patch=>setUser(p=>({…p,…patch}));
let view;
if(stage===‘splash’) view=React.createElement(Splash,null);
else if(stage===‘app’&&user) view=React.createElement({client:ClientShell,admin:AdminShell,mechanic:MechanicShell}[user.role]||Shell,{user,onLogout,onUpdate,lang,onLang:changeLang,showToast});
else if(stage===‘role’) view=React.createElement(RoleGate,{onPick:r=>{setRole(r);setStage(‘auth’);},onBack:()=>setStage(‘landing’)});
else if(stage===‘auth’) view=React.createElement(AuthScreen,{role,onAuth,onBack:()=>setStage(‘role’),showToast});
else if(stage===‘dev’) view=React.createElement(DevGate,{onBack:()=>setStage(‘landing’),showToast});
else view=React.createElement(Landing,{onEnter:()=>setStage(‘role’),onDev:()=>setStage(‘dev’),lang,onLang:changeLang});
return React.createElement(React.Fragment,null,view,React.createElement(Toast,{msg:toast}),
installMode&&stage!==‘splash’&&React.createElement(InstallBanner,{mode:installMode,onInstall:doInstall,onDismiss:dismissInstall}));
}
ReactDOM.render(React.createElement(App),document.getElementById(‘root’));
</script>
